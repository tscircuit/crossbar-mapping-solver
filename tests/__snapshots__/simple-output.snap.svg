.0851063829787" cy="385.53191489361706" r="11.914893617021274" fill="#2563eb" stroke="#0f172a" stroke-width="0.03357142857142858"/><circle data-type="circle" data-label="" data-x="14.800000000000002" data-y="-3.2" cx="588.0851063829787" cy="421.2765957446809" r="11.914893617021274" fill="#dc2626" stroke="#0f172a" stroke-width="0.03357142857142858"/><circle data-type="circle" data-label="" data-x="14.800000000000002" data-y="-4.4" cx="588.0851063829787" cy="457.02127659574467" r="11.914893617021274" fill="#059669" stroke="#0f172a" stroke-width="0.03357142857142858"/><circle data-type="circle" data-label="" data-x="14.800000000000002" data-y="-5.6000000000000005" cx="588.0851063829787" cy="492.7659574468085" r="11.914893617021274" fill="#7c3aed" stroke="#0f172a" stroke-width="0.03357142857142858"/><g><circle data-type="point" data-label="D0" data-x="0" data-y="6" cx="147.23404255319147" cy="147.23404255319156" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="D1" data-x="0" data-y="4" cx="147.23404255319147" cy="206.80851063829795" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="D2" data-x="0" data-y="2" cx="147.23404255319147" cy="266.3829787234043" r="3" fill="#059669"/></g><g><circle data-type="point" data-label="D3" data-x="0" data-y="0" cx="147.23404255319147" cy="325.95744680851067" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="D0" data-x="4" data-y="6" cx="266.3829787234042" cy="147.23404255319156" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="D1" data-x="4" data-y="4" cx="266.3829787234042" cy="206.80851063829795" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="D2" data-x="4" data-y="2" cx="266.3829787234042" cy="266.3829787234043" r="3" fill="#059669"/></g><g><circle data-type="point" data-label="D3" data-x="4" data-y="0" cx="266.3829787234042" cy="325.95744680851067" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="D0" data-x="8" data-y="6" cx="385.53191489361694" cy="147.23404255319156" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="D1" data-x="8" data-y="4" cx="385.53191489361694" cy="206.80851063829795" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="D2" data-x="8" data-y="2" cx="385.53191489361694" cy="266.3829787234043" r="3" fill="#059669"/></g><g><circle data-type="point" data-label="D3" data-x="8" data-y="0" cx="385.53191489361694" cy="325.95744680851067" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="D0 pad" data-x="14.800000000000002" data-y="-2" cx="588.0851063829787" cy="385.53191489361706" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="D1 pad" data-x="14.800000000000002" data-y="-3.2" cx="588.0851063829787" cy="421.2765957446809" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="D2 pad" data-x="14.800000000000002" data-y="-4.4" cx="588.0851063829787" cy="457.02127659574467" r="3" fill="#059669"/></g><g><circle data-type="point" data-label="D3 pad" data-x="14.800000000000002" data-y="-5.6000000000000005" cx="588.0851063829787" cy="492.7659574468085" r="3" fill="#7c3aed"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":29.787234042553184,"c":0,"e":147.23404255319147,"b":0,"d":-29.787234042553184,"f":325.95744680851067};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
