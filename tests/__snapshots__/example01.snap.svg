<svg width="1304" height="682" viewBox="0 0 1304 682" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(0, 0) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="white"/><text x="14" y="27" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#0f172a">Input: vertical fanout from the top</text><g transform="translate(0 42)"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,1.76 0,4.24" data-type="line" data-label="column x=0" points="320,572 320,138" fill="none" stroke="#94a3b8" stroke-width="8.750000000000002" stroke-dasharray="0.16 0.12"/></g><g><polyline data-points="0,4.8 0,4.4" data-type="line" data-label="D0 travels downward" points="320,40 320,109.99999999999989" fill="none" stroke="#2563eb" stroke-width="14.000000000000002"/></g><g><polyline data-points="0,2.8 0,2.4" data-type="line" data-label="D1 travels downward" points="320,390.00000000000006 320,460.00000000000006" fill="none" stroke="#dc2626" stroke-width="14.000000000000002"/></g><circle data-type="circle" data-label="" data-x="0" data-y="4" cx="320" cy="180" r="70.00000000000001" fill="#ffffff" stroke="#2563eb" stroke-width="0.005714285714285713"/><circle data-type="circle" data-label="" data-x="0" data-y="2" cx="320" cy="530" r="70.00000000000001" fill="#ffffff" stroke="#dc2626" stroke-width="0.005714285714285713"/><g><circle data-type="point" data-label="D0" data-x="0" data-y="4" cx="320" cy="180" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="D1" data-x="0" data-y="2" cx="320" cy="530" r="3" fill="#dc2626"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":175.00000000000003,"c":0,"e":320,"b":0,"d":-175.00000000000003,"f":880.0000000000001};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></g>
  </g>
