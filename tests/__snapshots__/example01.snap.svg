<svg width="1304" height="682" viewBox="0 0 1304 682" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(0, 0) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="white"/><text x="14" y="27" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#0f172a">Input: fanout line above the crossbars</text><g transform="translate(0 42)"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,2.656 0,4.144" data-type="line" data-label="column x=0" points="320,600 320,211.3432835820895" fill="none" stroke="#94a3b8" stroke-width="13.059701492537314" stroke-dasharray="0.16 0.12"/></g><g><polyline data-points="0,4.8 0,4.4" data-type="line" data-label="D0 travels downward" points="320,40 320,144.4776119402984" fill="none" stroke="#2563eb" stroke-width="20.895522388059703"/></g><g><polyline data-points="0,4 0,3.6" data-type="line" data-label="D1 travels downward" points="320,248.95522388059703 320,353.43283582089555" fill="none" stroke="#dc2626" stroke-width="20.895522388059703"/></g><g><polyline data-points="-0.12,2.8000000000000003 0.12,2.8000000000000003" data-type="line" data-label="fanout line" points="288.65671641791045,562.3880597014925 351.34328358208955,562.3880597014925" fill="none" stroke="#475569" stroke-width="18.28358208955224" stroke-dasharray="0.2 0.14"/></g><circle data-type="circle" data-label="" data-x="0" data-y="4" cx="320" cy="248.95522388059703" r="104.47761194029852" fill="#ffffff" stroke="#2563eb" stroke-width="0.003828571428571428"/><circle data-type="circle" data-label="" data-x="0" data-y="3.2" cx="320" cy="457.91044776119406" r="104.47761194029852" fill="#ffffff" stroke="#dc2626" stroke-width="0.003828571428571428"/><g><circle data-type="point" data-label="D0" data-x="0" data-y="4" cx="320" cy="248.95522388059703" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="D1" data-x="0" data-y="3.2" cx="320" cy="457.91044776119406" r="3" fill="#dc2626"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":261.1940298507463,"c":0,"e":320,"b":0,"d":-261.1940298507463,"f":1293.7313432835822};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></g>
  </g>
