<svg width="1304" height="682" viewBox="0 0 1304 682" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(0, 0) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="white"/><text x="14" y="27" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#0f172a">Input: fanout points share one horizontal line</text><g transform="translate(0 42)"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="1,8.1 1,7.4" data-type="line" data-label="N1 incoming fanout" points="320,40 320,84.5454545454545" fill="none" stroke="#2563eb" stroke-width="5.090909090909092"/></g><g><polyline data-points="-0.16,7.4 2.16,7.4" data-type="line" data-label="horizontal fanout line" points="246.1818181818182,84.5454545454545 393.81818181818187,84.5454545454545" fill="none" stroke="#475569" stroke-width="4.454545454545456" stroke-dasharray="0.2 0.14"/></g><g><polyline data-points="-0.16,0 2.16,0" data-type="line" data-label="crossbar row y=0" points="246.1818181818182,555.4545454545455 393.81818181818187,555.4545454545455" fill="none" stroke="#94a3b8" stroke-width="2.545454545454546" stroke-dasharray="0.15 0.13"/></g><g><polyline data-points="0,-0.7 0,0.4" data-type="line" data-label="column x=0" points="256.3636363636364,600 256.3636363636364,530" fill="none" stroke="#94a3b8" stroke-width="2.545454545454546" stroke-dasharray="0.12 0.12"/></g><g><polyline data-points="2,-0.7 2,0.4" data-type="line" data-label="column x=2" points="383.6363636363637,600 383.6363636363637,530" fill="none" stroke="#94a3b8" stroke-width="2.545454545454546" stroke-dasharray="0.12 0.12"/></g><g><rect data-type="rect" data-label="spread zone" data-x="1" data-y="3.9000000000000004" x="246.18181818181816" y="84.5454545454545" width="147.63636363636368" height="445.4545454545455" fill="rgba(254, 243, 199, 0.2)" stroke="#f59e0b" stroke-width="0.015714285714285712"/></g><circle data-type="circle" data-label="" data-x="1" data-y="7.4" cx="320" cy="84.5454545454545" r="8.272727272727275" fill="#2563eb" stroke="#0f172a" stroke-width="0.015714285714285712"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="256.3636363636364" cy="555.4545454545455" r="25.45454545454546" fill="#ffffff" stroke="#2563eb" stroke-width="0.015714285714285712"/><circle data-type="circle" data-label="" data-x="2" data-y="0" cx="383.6363636363637" cy="555.4545454545455" r="25.45454545454546" fill="#ffffff" stroke="#dc2626" stroke-width="0.015714285714285712"/><g><circle data-type="point" data-label="N1 fanout" data-x="1" data-y="7.4" cx="320" cy="84.5454545454545" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="N1" data-x="0" data-y="0" cx="256.3636363636364" cy="555.4545454545455" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="N2" data-x="2" data-y="0" cx="383.6363636363637" cy="555.4545454545455" r="3" fill="#dc2626"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":63.63636363636365,"c":0,"e":256.3636363636364,"b":0,"d":-63.63636363636365,"f":555.4545454545455};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></g>
  </g>
