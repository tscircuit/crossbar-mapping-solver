    <rect width="100%" height="100%" fill="white"/><text x="14" y="27" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#0f172a">Input: fanout points share one horizontal line</text><g transform="translate(0 42)"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="1,8.7 1,8" data-type="line" data-label="N1 incoming fanout" points="260.42553191489355,40 260.42553191489355,81.70212765957444" fill="none" stroke="#2563eb" stroke-width="4.765957446808511"/></g><g><polyline data-points="3,8.7 3,8" data-type="line" data-label="N2 incoming fanout" points="379.57446808510633,40 379.57446808510633,81.70212765957444" fill="none" stroke="#dc2626" stroke-width="4.765957446808511"/></g><g><polyline data-points="-0.32,8 4.32,8" data-type="line" data-label="horizontal fanout line" points="181.78723404255314,81.70212765957444 458.2127659574468,81.70212765957444" fill="none" stroke="#475569" stroke-width="4.170212765957448" stroke-dasharray="0.2 0.14"/></g><g><polyline data-points="-0.32,2 4.32,2" data-type="line" data-label="crossbar row y=2" points="181.78723404255314,439.1489361702128 458.2127659574468,439.1489361702128" fill="none" stroke="#94a3b8" stroke-width="2.3829787234042556" stroke-dasharray="0.15 0.13"/></g><g><polyline data-points="-0.32,0 4.32,0" data-type="line" data-label="crossbar row y=0" points="181.78723404255314,558.2978723404256 458.2127659574468,558.2978723404256" fill="none" stroke="#94a3b8" stroke-width="2.3829787234042556" stroke-dasharray="0.15 0.13"/></g><g><polyline data-points="0,-0.7 0,2.4" data-type="line" data-label="column x=0" points="200.8510638297872,600 200.8510638297872,415.3191489361702" fill="none" stroke="#94a3b8" stroke-width="2.3829787234042556" stroke-dasharray="0.12 0.12"/></g><g><polyline data-points="2,-0.7 2,2.4" data-type="line" data-label="column x=2" points="320,600 320,415.3191489361702" fill="none" stroke="#94a3b8" stroke-width="2.3829787234042556" stroke-dasharray="0.12 0.12"/></g><g><polyline data-points="4,-0.7 4,2.4" data-type="line" data-label="column x=4" points="439.1489361702128,600 439.1489361702128,415.3191489361702" fill="none" stroke="#94a3b8" stroke-width="2.3829787234042556" stroke-dasharray="0.12 0.12"/></g><g><rect data-type="rect" data-label="spread zone" data-x="2" data-y="5.2" x="181.7872340425532" y="81.70212765957444" width="276.4255319148936" height="333.6170212765958" fill="rgba(254, 243, 199, 0.2)" stroke="#f59e0b" stroke-width="0.016785714285714282"/></g><circle data-type="circle" data-label="" data-x="1" data-y="8" cx="260.42553191489355" cy="81.70212765957444" r="7.744680851063831" fill="#2563eb" stroke="#0f172a" stroke-width="0.016785714285714282"/><circle data-type="circle" data-label="" data-x="3" data-y="8" cx="379.57446808510633" cy="81.70212765957444" r="7.744680851063831" fill="#dc2626" stroke="#0f172a" stroke-width="0.016785714285714282"/><circle data-type="circle" data-label="" data-x="0" data-y="2" cx="200.8510638297872" cy="439.1489361702128" r="23.829787234042556" fill="#ffffff" stroke="#2563eb" stroke-width="0.016785714285714282"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="200.8510638297872" cy="558.2978723404256" r="23.829787234042556" fill="#ffffff" stroke="#059669" stroke-width="0.016785714285714282"/><circle data-type="circle" data-label="" data-x="2" data-y="2" cx="320" cy="439.1489361702128" r="23.829787234042556" fill="#ffffff" stroke="#dc2626" stroke-width="0.016785714285714282"/><circle data-type="circle" data-label="" data-x="2" data-y="0" cx="320" cy="558.2978723404256" r="23.829787234042556" fill="#ffffff" stroke="#7c3aed" stroke-width="0.016785714285714282"/><circle data-type="circle" data-label="" data-x="4" data-y="2" cx="439.1489361702128" cy="439.1489361702128" r="23.829787234042556" fill="#ffffff" stroke="#2563eb" stroke-width="0.016785714285714282"/><circle data-type="circle" data-label="" data-x="4" data-y="0" cx="439.1489361702128" cy="558.2978723404256" r="23.829787234042556" fill="#ffffff" stroke="#059669" stroke-width="0.016785714285714282"/><g><circle data-type="point" data-label="N1 fanout" data-x="1" data-y="8" cx="260.42553191489355" cy="81.70212765957444" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="N2 fanout" data-x="3" data-y="8" cx="379.57446808510633" cy="81.70212765957444" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="N1" data-x="0" data-y="2" cx="200.8510638297872" cy="439.1489361702128" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="N3" data-x="0" data-y="0" cx="200.8510638297872" cy="558.2978723404256" r="3" fill="#059669"/></g><g><circle data-type="point" data-label="N2" data-x="2" data-y="2" cx="320" cy="439.1489361702128" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="N4" data-x="2" data-y="0" cx="320" cy="558.2978723404256" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="N1" data-x="4" data-y="2" cx="439.1489361702128" cy="439.1489361702128" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="N3" data-x="4" data-y="0" cx="439.1489361702128" cy="558.2978723404256" r="3" fill="#059669"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":59.57446808510639,"c":0,"e":200.8510638297872,"b":0,"d":-59.57446808510639,"f":558.2978723404256};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></g>
  </g>
